# supershell-theme — supershell's own prompt theme — rounded start (`supershell prompt cap on`).
# GENERATED by scripts/gen-supershell-theme.py — edit that script, not this file.
# Full-width powerline bar, square ends, clock at the right; extras on line 2.
# Colours: `palette` below (supershell theme colors <name>); root shells use their
# own palette (supershell theme root-colors <name>). Your own
# ~/.config/supershell/prompt.toml still wins over everything here.

"$schema" = "https://starship.rs/config-schema.json"
add_newline = true
command_timeout = 500
scan_timeout = 20
palette = "supershell"

format = """
[](fg:c1)\
$os\
$username\
[](bg:c2 fg:c1)\
$directory\
[](fg:c2 bg:c3)\
$git_branch\
$git_status\
[](fg:c3 bg:c4)\
$c\
$cpp\
$golang\
$java\
$kotlin\
$nodejs\
$bun\
$deno\
$python\
$rust\
$php\
$ruby\
$lua\
$dotnet\
$elixir\
$haskell\
$scala\
$zig\
[](fg:c4 bg:c5)\
$docker_context\
[](fg:c5 bg:c6)\
$fill\
$time\
$line_break\
$kubernetes$cmd_duration$jobs$status$character"""

[os]
disabled = true
style = "bg:c1 fg:t1"
format = "[ $symbol]($style)"

[username]
show_always = true
style_user = "bg:c1 fg:t1"
style_root = "bold bg:c1 fg:t1"
format = '[ $user ]($style)'

[directory]
style = "bg:c2 fg:t2"
read_only_style = "bg:c2 fg:t2"
format = "[ $path ]($style)[$read_only]($read_only_style)"
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"

[git_branch]
style = "bg:c3 fg:t3"
format = '[ $symbol$branch(:$remote_branch) ]($style)'

[git_status]
style = "bg:c3 fg:t3"
format = '[($all_status$ahead_behind )]($style)'
# one mark per kind, with how many files: !3 = 3 modified, ?1 = 1 new (untracked),
# +2 staged, ✘ deleted, » renamed, = conflicts, ≡ stashes, ⇡/⇣ ahead/behind
modified = "!${count}"
untracked = "?${count}"
staged = "+${count}"
deleted = "✘${count}"
renamed = "»${count}"
conflicted = "=${count}"
stashed = "≡${count}"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"

[c]
style = "bg:c4 fg:t4"
format = '[ $symbol($version) ]($style)'

[cpp]
style = "bg:c4 fg:t4"
format = '[ $symbol($version) ]($style)'

[golang]
style = "bg:c4 fg:t4"
format = '[ $symbol($version) ]($style)'

[java]
style = "bg:c4 fg:t4"
format = '[ $symbol($version) ]($style)'

[kotlin]
style = "bg:c4 fg:t4"
format = '[ $symbol($version) ]($style)'

[nodejs]
style = "bg:c4 fg:t4"
format = '[ $symbol($version) ]($style)'

[bun]
style = "bg:c4 fg:t4"
format = '[ $symbol($version) ]($style)'

[deno]
style = "bg:c4 fg:t4"
format = '[ $symbol($version) ]($style)'

[python]
style = "bg:c4 fg:t4"
format = '[ $symbol($version) ]($style)'

[rust]
style = "bg:c4 fg:t4"
format = '[ $symbol($version) ]($style)'

[php]
style = "bg:c4 fg:t4"
format = '[ $symbol($version) ]($style)'

[ruby]
style = "bg:c4 fg:t4"
format = '[ $symbol($version) ]($style)'

[lua]
style = "bg:c4 fg:t4"
format = '[ $symbol($version) ]($style)'

[dotnet]
style = "bg:c4 fg:t4"
format = '[ $symbol($version) ]($style)'

[elixir]
style = "bg:c4 fg:t4"
format = '[ $symbol($version) ]($style)'

[haskell]
style = "bg:c4 fg:t4"
format = '[ $symbol($version) ]($style)'

[scala]
style = "bg:c4 fg:t4"
format = '[ $symbol($version) ]($style)'

[zig]
style = "bg:c4 fg:t4"
format = '[ $symbol($version) ]($style)'

[docker_context]
disabled = @DEVOPS_OFF@
style = "bg:c5 fg:t5"
format = '[ $symbol$context ]($style)'
only_with_files = true

[time]
disabled = false
time_format = "%R"
style = "bg:c6 fg:t6"
format = '[ ♥ $time ]($style)'

[fill]
symbol = " "
style = "bg:c6"

[line_break]
disabled = false

[kubernetes]
# DevOps safety: always see which cluster/namespace you are about to change.
disabled = @DEVOPS_OFF@
style = "bold fg:info"
format = '[$symbol$context( \($namespace\))]($style) '

[cmd_duration]
min_time = 2000
style = "fg:warn"
format = "[$duration]($style) "

[jobs]
symbol = "✦"
style = "bold fg:info"

[status]
disabled = false
style = "bold fg:err"
format = "[✘ $status]($style) "

[character]
success_symbol = "[❯](bold fg:ok)"
error_symbol = "[❯](bold fg:err)"
vimcmd_symbol = "[❮](bold fg:ok)"

