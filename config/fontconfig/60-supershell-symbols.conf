<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- supershell: fallbacks for the terminal fonts it supports. Letters still come from
     your main font; only glyphs it lacks are taken from these, in this order:
       1. "Symbols Nerd Font Mono" for icons and prompt separators;
       2. "DejaVu Sans Mono" for Arabic, so Arabic stays fixed-width in the terminal
          (without this rule fontconfig picks the proportional "DejaVu Sans").
     Fonts that have Arabic themselves (DejaVu Sans Mono, Cascadia) keep their own.
     binding="strong": with "weak", fontconfig ranks other installed fonts first
     (e.g. Cascadia Code NF for icons, DejaVu Sans for Arabic). -->
<fontconfig>
  <match target="pattern">
    <test name="family" qual="any"><string>monospace</string></test>
    <edit name="family" mode="append" binding="strong"><string>Symbols Nerd Font Mono</string></edit>
    <edit name="family" mode="append" binding="strong"><string>DejaVu Sans Mono</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>DejaVu Sans Mono</string></test>
    <edit name="family" mode="append" binding="strong"><string>Symbols Nerd Font Mono</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Cascadia Code</string></test>
    <edit name="family" mode="append" binding="strong"><string>Symbols Nerd Font Mono</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Cascadia Mono</string></test>
    <edit name="family" mode="append" binding="strong"><string>Symbols Nerd Font Mono</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>JetBrains Mono</string></test>
    <edit name="family" mode="append" binding="strong"><string>Symbols Nerd Font Mono</string></edit>
    <edit name="family" mode="append" binding="strong"><string>DejaVu Sans Mono</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Fira Code</string></test>
    <edit name="family" mode="append" binding="strong"><string>Symbols Nerd Font Mono</string></edit>
    <edit name="family" mode="append" binding="strong"><string>DejaVu Sans Mono</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>IBM Plex Mono</string></test>
    <edit name="family" mode="append" binding="strong"><string>Symbols Nerd Font Mono</string></edit>
    <edit name="family" mode="append" binding="strong"><string>DejaVu Sans Mono</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Ubuntu Sans Mono</string></test>
    <edit name="family" mode="append" binding="strong"><string>Symbols Nerd Font Mono</string></edit>
    <edit name="family" mode="append" binding="strong"><string>DejaVu Sans Mono</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>Ubuntu Mono</string></test>
    <edit name="family" mode="append" binding="strong"><string>Symbols Nerd Font Mono</string></edit>
    <edit name="family" mode="append" binding="strong"><string>DejaVu Sans Mono</string></edit>
  </match>
</fontconfig>
