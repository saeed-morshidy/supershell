# supershell tmux defaults — written only if you had no tmux config.
# Prefix stays Ctrl-b (the default you'll find on every server).
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10          # Esc is instant in Neovim
set -g focus-events on
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g set-clipboard on

# Split panes in the current folder:  prefix |   prefix -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.config/tmux/tmux.conf \; display "config reloaded"

# Minimal status line in terminal colours.
set -g status-style "bg=default,fg=white"
set -g status-left "#[fg=blue,bold] #S "
set -g status-right "#[fg=brightblack]%H:%M "
setw -g window-status-format " #I #W "
setw -g window-status-current-format "#[fg=green,bold] #I #W "
