# supershell tool manifest — the single source of truth for versions and checksums.
#
# How a tool is installed (decided on the user's machine, never assumed):
#   1. `apt` package, if the archive's candidate version is >= `apt_min`.
#   2. Otherwise the pinned GitHub release: `url.<arch>`, verified against
#      `sha256.<arch>`. If no pinned hash is present, the installer falls back to
#      the upstream checksum file in `sums` (and warns); with neither, it refuses.
#
# Maintainers: refresh versions + hashes with `scripts/update-manifest.sh`, which
# downloads every asset and writes its SHA-256 here. Every change to this file is
# a security-relevant change and needs the normal 3 approvals.
#
# Keys: version, apt, apt_min, apt_bins (pkgbin:name …), url.x86_64, url.aarch64,
#       sha256.x86_64, sha256.aarch64, sums (template, {url} = asset URL),
#       bins (path-in-archive[:link-name] …), keep (yes = keep whole tree)

[starship]
version = 1.27.0
apt = starship
# 1.27: the catppuccin-powerline prompt preset (Ubuntu 26.04 ships 1.22.1, so the
# pinned release is used there).
apt_min = 1.27
url.x86_64 = https://github.com/starship/starship/releases/download/v{version}/starship-x86_64-unknown-linux-musl.tar.gz
url.aarch64 = https://github.com/starship/starship/releases/download/v{version}/starship-aarch64-unknown-linux-musl.tar.gz
sha256.x86_64 = 10c8eb4cb3b761d9bf59ea828444c2dab36c900b7d69a69e08814b286969df89
sha256.aarch64 = 341f5cbf24699fa0b27ec88965ad25f862ea09e15d35a543fd6ffdff1d2aa00d
sums = {url}.sha256
bins = starship

[fzf]
version = 0.62.0
